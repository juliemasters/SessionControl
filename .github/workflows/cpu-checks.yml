name: CPU checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-experiments.txt
      - run: CUDA_VISIBLE_DEVICES="" python -m unittest discover -v
      - run: CUDA_VISIBLE_DEVICES="" python -m unittest discover -s tests -v
      - run: python scripts/verify_release.py
